<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario Bancoppel</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f4f4; }
    label { display: block; margin-top: 10px; }
    input, select, textarea, button {
      width: 100%; padding: 8px; margin-top: 5px;
    }
    button { margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Formulario Bancoppel</h2>

  <label>Nombre Cliente<input id="nombre" /></label>
  <label>No. Cliente Bancoppel<input id="cliente" /></label>
  <label>Edad<input id="edad" /></label>
  <label>Antigüedad del Banco<input id="antiguedad" /></label>
  <label>Correo Electrónico<input id="correo" /></label>
  <label>Celular<input id="celular" /></label>
  <label>Teléfono Fijo<input id="telefono" /></label>
  <label>Zona<input id="zona" /></label>
  <label>Tipificación<select id="tipificacion"></select></label>
  <label>Observaciones<textarea id="observaciones"></textarea></label>

  <button onclick="generarRegistro()">Generar registro</button>
  <button onclick="guardarRegistro()">Guardar registro</button>
  <button onclick="buscarRegistro()">Buscar registro</button>

  <script>
    const url = "https://script.google.com/macros/s/AKfycbzj4hezK0FrNygSsXCyCyb89iVfduc8G715zWJ7uc3wCP9TL4sk-3Bpow7b2OdjpxF9/exec";

    // Cargar lista de tipificaciones
    fetch(url + "?function=obtenerTipificaciones")
      .then(res => res.json())
      .then(data => {
        const select = document.getElementById("tipificacion");
        data.forEach(t => {
          const opt = document.createElement("option");
          opt.value = opt.textContent = t;
          select.appendChild(opt);
        });
      });

    function generarRegistro() {
      fetch(url + "?function=generarRegistro")
        .then(res => res.json())
        .then(data => {
          document.getElementById("nombre").value = data.nombre || "";
          document.getElementById("cliente").value = data.cliente || "";
          document.getElementById("edad").value = data.edad || "";
          document.getElementById("antiguedad").value = data.antiguedad || "";
          document.getElementById("correo").value = data.correo || "";
          document.getElementById("celular").value = data.celular || "";
          document.getElementById("telefono").value = data.telefono || "";
          document.getElementById("zona").value = data.zona || "";
          document.getElementById("tipificacion").value = "";
          document.getElementById("observaciones").value = "";
        });
    }

    function guardarRegistro() {
      const datos = {
        nombre: document.getElementById("nombre").value,
        cliente: document.getElementById("cliente").value,
        edad: document.getElementById("edad").value,
        antiguedad: document.getElementById("antiguedad").value,
        correo: document.getElementById("correo").value,
        celular: document.getElementById("celular").value,
        telefono: document.getElementById("telefono").value,
        zona: document.getElementById("zona").value,
        tipificacion: document.getElementById("tipificacion").value,
        observaciones: document.getElementById("observaciones").value
      };

      fetch(url, {
        method: "POST",
        body: JSON.stringify(datos),
        headers: { "Content-Type": "application/json" }
      })
        .then(res => res.text())
        .then(msg => alert(msg));
    }

    function buscarRegistro() {
      const celular = prompt("Ingresa número de celular para buscar:");
      if (!celular) return;

      fetch(url + "?function=buscarRegistro&celular=" + encodeURIComponent(celular))
        .then(res => res.json())
        .then(data => {
          if (!data) return alert("No se encontró el registro.");

          document.getElementById("nombre").value = data.nombre || "";
          document.getElementById("cliente").value = data.cliente || "";
          document.getElementById("edad").value = data.edad || "";
          document.getElementById("antiguedad").value = data.antiguedad || "";
          document.getElementById("correo").value = data.correo || "";
          document.getElementById("celular").value = data.celular || "";
          document.getElementById("telefono").value = data.telefono || "";
          document.getElementById("zona").value = data.zona || "";
          document.getElementById("tipificacion").value = data.tipificacion || "";
          document.getElementById("observaciones").value = data.observaciones || "";
        });
    }
  </script>
</body>
</html>
